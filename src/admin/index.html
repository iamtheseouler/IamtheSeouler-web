<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>The Seouler — 글 관리</title>
<!-- Absolute path on purpose. vercel.json sets cleanUrls, so this page is
     served at /admin with no trailing slash, and a relative "config.yml"
     would be looked for at the site root. -->
<link href="/admin/config.yml" type="text/yaml" rel="cms-config-url">
</head>
<body>
<noscript>이 화면은 자바스크립트가 있어야 열립니다.</noscript>
<!-- The bundle does not start itself here, so we start it. CMS_MANUAL_INIT
     makes that explicit and keeps it from being started twice. -->
<script>window.CMS_MANUAL_INIT = true;</script>
<script type="module">
  import "https://unpkg.com/@sveltia/cms@0.191.1/dist/sveltia-cms.mjs";
  window.CMS.init();
</script>
</body>
</html>
